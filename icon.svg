<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B16"/>
      <stop offset="100%" stop-color="#101C30"/>
    </linearGradient>

    <linearGradient id="logo" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14"
                    flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Premium app background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- Subtle inner panel -->
  <rect x="28" y="28" width="456" height="456" rx="94"
        fill="none"
        stroke="#1E3A5F"
        stroke-width="2"
        opacity="0.55"/>

  <!-- SMARTSAVER monogram -->
  <g filter="url(#shadow)">

    <!-- Upper S curve -->
    <path
      d="M356 178
         C333 151 299 137 258 137
         C201 137 160 168 160 215
         C160 260 195 281 251 296"
      fill="none"
      stroke="url(#logo)"
      stroke-width="42"
      stroke-linecap="round"/>

    <!-- Lower S curve -->
    <path
      d="M251 296
         C306 311 341 331 341 372
         C341 417 299 443 250 443
         C207 443 171 428 146 397"
      fill="none"
      stroke="url(#logo)"
      stroke-width="42"
      stroke-linecap="round"/>

    <!-- Smart upward accent -->
    <path
      d="M334 111
         L392 111
         L392 169"
      fill="none"
      stroke="#67E8F9"
      stroke-width="16"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <path
      d="M392 111 L326 177"
      fill="none"
      stroke="#67E8F9"
      stroke-width="16"
      stroke-linecap="round"/>
  </g>

  <!-- Small brand detail -->
  <circle cx="126" cy="126" r="7" fill="#38BDF8"/>
  <circle cx="386" cy="386" r="5" fill="#22C55E"/>
</svg>
