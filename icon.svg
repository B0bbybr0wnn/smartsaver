<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Polished black background -->
    <radialGradient id="bg" cx="35%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#20242B"/>
      <stop offset="45%" stop-color="#0B0D10"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Metallic white / blue logo -->
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#DCEBFF"/>
      <stop offset="48%" stop-color="#6EA8FF"/>
      <stop offset="68%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#5B8DEF"/>
    </linearGradient>

    <!-- Blue reflected edge -->
    <linearGradient id="edge" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#174EA6"/>
      <stop offset="50%" stop-color="#8FC7FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Fine grain / noise -->
    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.75"
        numOctaves="3"
        seed="17"
        result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table"
          tableValues="0 0.10"/>
      </feComponentTransfer>
    </filter>

    <!-- Soft logo shadow -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow
        dx="0"
        dy="12"
        stdDeviation="12"
        flood-color="#000000"
        flood-opacity="0.8"/>
    </filter>

    <!-- Subtle blue glow -->
    <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <clipPath id="rounded">
      <rect width="512" height="512" rx="118"/>
    </clipPath>
  </defs>

  <!-- Premium polished black background -->
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>

  <!-- Very subtle blue atmosphere -->
  <circle
    cx="390"
    cy="105"
    r="150"
    fill="#146EF5"
    opacity="0.10"
    filter="url(#blueGlow)"/>

  <!-- Grain texture -->
  <rect
    width="512"
    height="512"
    filter="url(#grain)"
    opacity="0.55"
    clip-path="url(#rounded)"/>

  <!-- Modern SmartSaver symbol -->
  <g filter="url(#shadow)">

    <!-- Blue depth behind the mark -->
    <path
      d="M360 157
         C333 130 298 116 257 116
         C191 116 140 155 140 214
         C140 270 181 294 246 312
         C285 323 302 335 302 354
         C302 376 282 389 252 389
         C216 389 184 376 157 351"
      fill="none"
      stroke="#1769E8"
      stroke-width="58"
      stroke-linecap="round"
      opacity="0.28"
      filter="url(#blueGlow)"/>

    <!-- Main S -->
    <path
      d="M360 157
         C333 130 298 116 257 116
         C191 116 140 155 140 214
         C140 270 181 294 246 312
         C285 323 302 335 302 354
         C302 376 282 389 252 389
         C216 389 184 376 157 351"
      fill="none"
      stroke="url(#metal)"
      stroke-width="46"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <!-- Polished highlight -->
    <path
      d="M360 157
         C333 130 298 116 257 116"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="9"
      stroke-linecap="round"
      opacity="0.9"/>

    <!-- Smart upward slash -->
    <path
      d="M330 101 L405 101 L405 176"
      fill="none"
      stroke="url(#edge)"
      stroke-width="16"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <path
      d="M405 101 L323 183"
      fill="none"
      stroke="url(#edge)"
      stroke-width="16"
      stroke-linecap="round"/>

  </g>

  <!-- Tiny reflective detail -->
  <circle
    cx="110"
    cy="112"
    r="5"
    fill="#FFFFFF"
    opacity="0.75"/>

  <circle
    cx="404"
    cy="397"
    r="4"
    fill="#5EA7FF"
    opacity="0.8"/>

  <!-- Fine surface noise over entire icon -->
  <rect
    width="512"
    height="512"
    filter="url(#grain)"
    opacity="0.22"
    clip-path="url(#rounded)"
    pointer-events="none"/>
</svg>
