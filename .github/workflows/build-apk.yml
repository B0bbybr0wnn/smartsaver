name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK command-line tools
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          sudo mv cmdline-tools /usr/local/lib/android/sdk/cmdline-tools/latest
          sudo chmod +x /usr/local/lib/android/sdk/cmdline-tools/latest/bin/*
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept licenses and install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Copy web files into www folder
        run: |
          mkdir -p www
          cp index.html www/
          cp app.js www/
          cp styles.css www/
          cp locales.js www/
          cp manifest.json www/
          cp sw.js www/
          cp icon.svg www/
          cp icon-192.png www/
          cp icon-512.png www/
          cp icon-maskable-512.png www/
          cp apple-touch-icon.png www/
          ls -la www/

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android app icons from icon-1024.png
        run: |
          mkdir -p resources
          cp icon-1024.png resources/icon.png
          npx @capacitor/assets generate --android --iconBackgroundColor '#0a0e1a' --iconBackgroundColorDark '#0a0e1a' --splashBackgroundColor '#0a0e1a' --splashBackgroundColorDark '#0a0e1a' || true

      - name: Inject AdMob App ID into AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 << 'PYEOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, 'r') as f:
              content = f.read()

          admob_meta = '''        <meta-data
              android:name="com.google.android.gms.ads.APPLICATION_ID"
              android:value="ca-app-pub-3940256099942544~3347511713" />
'''

          if 'com.google.android.gms.ads.APPLICATION_ID' not in content:
              idx = content.find('</application>')
              if idx != -1:
                  content = content[:idx] + admob_meta + '    ' + content[idx:]
                  with open(path, 'w') as f:
                      f.write(content)
                  print("AdMob App ID injected.")
              else:
                  print("Could not find </application>")
          else:
              print("AdMob App ID already present")
          PYEOF

      - name: Add deep link intent filter to Android manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'smartsaver' "$MANIFEST"; then
            python3 << 'PYEOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, 'r') as f:
              content = f.read()

          deep_link_filter = '''            <intent-filter android:autoVerify="false">
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="smartsaver" android:host="auth" android:pathPrefix="/callback" />
              </intent-filter>
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="smartsaver" />
              </intent-filter>
          '''

          idx = content.find('</activity>')
          if idx != -1:
              content = content[:idx] + deep_link_filter + '        ' + content[idx:]
              with open(path, 'w') as f:
                  f.write(content)
              print("Deep link intent filter added.")
          else:
              print("Could not find </activity> tag.")
          PYEOF
          else
            echo "Deep link already present"
          fi

      - name: Sync web assets
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartSaver-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
