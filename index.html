<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartSaver</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #f1f5f9; min-height: 100vh; display: flex; justify-content: center; padding: 20px; }
.app { width: 100%; max-width: 420px; }
header { text-align: center; margin-bottom: 24px; }
h1 { font-size: 28px; color: #38bdf8; }
.tagline { font-size: 14px; color: #94a3b8; margin-top: 4px; }
.card { background: #1e293b; border-radius: 16px; padding: 20px; }
label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
input { width: 100%; padding: 12px; font-size: 16px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #f1f5f9; margin-bottom: 14px; }
input:focus { outline: none; border-color: #38bdf8; }
button { width: 100%; padding: 14px; font-size: 16px; font-weight: 600; border: none; border-radius: 10px; background: #38bdf8; color: #0f172a; cursor: pointer; }
.result { margin-top: 16px; padding: 16px; border-radius: 12px; background: #0f172a; border-left: 4px solid #38bdf8; display: none; }
.result.show { display: block; }
.result.yes { border-left-color: #22c55e; }
.result.no { border-left-color: #ef4444; }
.result h2 { font-size: 20px; margin-bottom: 8px; }
.result p { font-size: 14px; color: #cbd5e1; line-height: 1.5; }
.big { font-size: 24px; font-weight: 700; color: #38bdf8; }
</style>
</head>
<body>
<div class="app">
<header>
<h1>SmartSaver</h1>
<p class="tagline">Before you make a money decision, ask SmartSaver.</p>
</header>
<div class="card">
<label>Item / Purchase name</label>
<input id="itemName" type="text" placeholder="e.g. New phone" />
<label>Price</label>
<input id="price" type="number" placeholder="e.g. 50000" />
<label>Your current balance</label>
<input id="balance" type="number" placeholder="e.g. 120000" />
<label>Monthly income</label>
<input id="income" type="number" placeholder="e.g. 80000" />
<label>Essential monthly expenses</label>
<input id="expenses" type="number" placeholder="e.g. 50000" />
<button onclick="checkAffordability()">Can I afford this?</button>
<div id="result" class="result">
<h2 id="verdict"></h2>
<p id="explanation"></p>
</div>
</div>
</div>
<script>
function checkAffordability() {
const name = document.getElementById('itemName').value || 'this';
const price = parseFloat(document.getElementById('price').value) || 0;
const balance = parseFloat(document.getElementById('balance').value) || 0;
const income = parseFloat(document.getElementById('income').value) || 0;
const expenses = parseFloat(document.getElementById('expenses').value) || 0;
const result = document.getElementById('result');
const verdict = document.getElementById('verdict');
const explanation = document.getElementById('explanation');
if (price <= 0 || balance <= 0) {
result.className = 'result show';
verdict.textContent = 'Enter your numbers';
explanation.textContent = 'Fill in the price and balance so I can help.';
return;
}
const leftover = income - expenses;
const afterPurchase = balance - price;
const monthlyBuffer = leftover > 0 ? leftover : 0;
result.className = 'result show';
if (price > balance) {
result.className = 'result show no';
verdict.textContent = 'Not yet';
explanation.innerHTML = 'Buying <b>' + name + '</b> for <span class="big">' + price.toLocaleString() + '</span> is more than your balance of ' + balance.toLocaleString() + '.<br><br>You are short by <b>' + (price - balance).toLocaleString() + '</b>. Save for that first.';
} else if (afterPurchase < monthlyBuffer) {
result.className = 'result show no';
verdict.textContent = 'Risky';
explanation.innerHTML = 'You can buy <b>' + name + '</b>, but after paying ' + price.toLocaleString() + ' you would have only <b>' + afterPurchase.toLocaleString() + '</b> left.<br><br>Your monthly buffer is ' + monthlyBuffer.toLocaleString() + '. Give it one more month.';
} else {
result.className = 'result show yes';
verdict.textContent = 'Yes, you can';
explanation.innerHTML = 'After buying <b>' + name + '</b> for ' + price.toLocaleString() + ', you will still have <b>' + afterPurchase.toLocaleString() + '</b> above your monthly buffer of ' + monthlyBuffer.toLocaleString() + '.<br><br>Go ahead, but log it.';
}
}
</script>
</body>
</html>
